apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
# Secret: Superset credentials
apiVersion: v1
kind: Secret
metadata:
  name: superset-env
  namespace: __NAMESPACE__
  labels:
    app: superset
type: Opaque
stringData:
  SUPERSET_SECRET_KEY: "__SUPERSET_SECRET_KEY__"
  DATABASE_URL: "postgresql://superset:__SUPERSET_PASSWORD__@superset-postgresql:5432/superset"
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-postgresql
  namespace: __NAMESPACE__
  labels:
    app: superset-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset-postgresql
  strategy:
    type: Recreate  # Single replica, no PVC — Recreate is fine
  template:
    metadata:
      labels:
        app: superset-postgresql
    spec:
      containers:
        - name: postgresql
          image: docker.io/bitnamilegacy/postgresql:14.17.0-debian-12-r3
          env:
            - name: POSTGRES_DB
              value: superset
            - name: POSTGRES_USER
              value: superset
            - name: POSTGRES_PASSWORD
              value: __SUPERSET_PASSWORD__
          ports:
            - containerPort: 5432
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: superset-postgresql
  namespace: __NAMESPACE__
  labels:
    app: superset-postgresql
spec:
  selector:
    app: superset-postgresql
  ports:
    - port: 5432
      targetPort: 5432
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-redis
  namespace: __NAMESPACE__
  labels:
    app: superset-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset-redis
  template:
    metadata:
      labels:
        app: superset-redis
    spec:
      containers:
        - name: redis
          image: docker.io/redis:7.0-alpine
          command: ["redis-server", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: superset-redis
  namespace: __NAMESPACE__
  labels:
    app: superset-redis
spec:
  selector:
    app: superset-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Superset Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: __NAMESPACE__
  labels:
    app: superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: superset
    spec:
      containers:
        - name: superset
          image: docker.io/apache/superset:6.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-env
                  key: SUPERSET_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superset-env
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: "superset-redis"
            - name: REDIS_PORT
              value: "6379"
          ports:
            - containerPort: 8088
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
          # postStart hook: create missing symlink for static assets
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    if [ ! -L /app/static ] && [ -d /app/superset/static ]; then
                      ln -sf /app/superset/static /app/static
                    fi
---
# Superset Service
apiVersion: v1
kind: Service
metadata:
  name: superset-svc
  namespace: __NAMESPACE__
  labels:
    app: superset
spec:
  selector:
    app: superset
  ports:
    - port: 8088
      targetPort: 8088
---
# Superset Ingress (TLS via cert-manager)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superset-ingress
  namespace: __NAMESPACE__
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: public
  tls:
    - hosts:
        - __SUPERSET_HOST__
      secretName: superset-tls
  rules:
    - host: __SUPERSET_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superset-svc
                port:
                  number: 8088
---
# Superset Init Job (migrations + admin user)
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-init
  namespace: __NAMESPACE__
  labels:
    app: superset-init
spec:
  template:
    metadata:
      labels:
        app: superset-init
    spec:
      containers:
        - name: superset-init
          image: docker.io/apache/superset:6.1.0
          env:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-env
                  key: SUPERSET_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superset-env
                  key: DATABASE_URL
          command:
            - sh
            - -c
            - |
              echo "Running database migrations..."
              superset db upgrade
              echo "Creating admin user..."
              superset fab create-admin \
                --username __SUPERSET_ADMIN_USER__ \
                --firstname Admin \
                --lastname User \
                --email admin@local.lan \
                --password __SUPERSET_ADMIN_PASSWORD__ \
                --non-interactive || true
              echo "Initializing Superset..."
              superset init
              echo "Initialization complete!"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      restartPolicy: Never
